<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>JARVIS // GESTURE INTERFACE</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/gesture/app.css">
<script type="module" src="/gesture/app.js"></script>
</head>
<body>
<div class="stage">
  <div class="cam">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="tag">KAMERA // HAND TRACKING</div>
  </div>
  <div class="orb">
    <canvas id="orb"></canvas>
    <div class="hud">
      <h1>GESTURE // INTERFACE</h1>
      <div class="sub">MEDIAPIPE HANDS · CANVAS PARTIKEL · LOKAL</div>
      <div class="row">TRACKING: <b id="st" class="off">LADE MODELL…</b></div>
      <div class="row">HÄNDE ERKANNT: <b id="hands">0</b> · FPS: <b id="fps">0</b></div>
      <div class="row">GESTE: <b id="gest">–</b></div>
      <div class="row">JARVIS: <b id="jv" class="off">NICHT VERBUNDEN</b></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="panel">
      <label for="token">JARVIS_EVENT_TOKEN</label>
      <input id="token" type="password" placeholder="aus .env" autocomplete="off">
      <label for="cmdA">👍 DAUMEN HOCH (1 s) SENDET</label>
      <input id="cmdA" value="Was steht heute bei mir an? Kurz.">
      <label for="cmdB">✊ FAUST (2 s) SENDET</label>
      <input id="cmdB" value="Mach das Licht im Büro aus.">
      <div class="btns">
        <button id="mic">🎙 Mikro für den Puls</button>
        <button id="talk">🗣 Sprechen (Leertaste)</button>
      </div>
      <div class="reply" id="reply"></div>
    </div>
  </div>
</div>
</body>
</html>
