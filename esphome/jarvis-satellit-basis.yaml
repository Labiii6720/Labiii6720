# JARVIS Satellit – gemeinsame Basis für alle Satelliten (Wohnraum, Bad)
# ESP32-S3 (DevKitC-1 mit 8 MB PSRAM) + INMP441 I2S-Mikrofon + MAX98357A I2S-Verstärker + Lautsprecher + WS2812-LED
# Wakeword «Hey Jarvis» läuft lokal auf dem Chip (micro_wake_word). Spracherkennung, Antwort und Stimme kommen
# über die Sprach-Pipeline von Home Assistant; dort ist Jarvis als Gesprächs-Agent eingetragen (siehe README).
#
# Nicht direkt flashen: jarvis-satellit.yaml bzw. jarvis-satellit-bad.yaml binden diese Datei als Paket ein
# und setzen nur Name und Anzeigename. Prüfen mit:  esphome config jarvis-satellit.yaml

substitutions:
  # I2S-Mikrofon INMP441
  mic_sck: GPIO5
  mic_ws: GPIO4
  mic_sd: GPIO6
  # I2S-Verstärker MAX98357A
  amp_bclk: GPIO15
  amp_lrclk: GPIO16
  amp_din: GPIO7
  led_pin: GPIO48
  # LED-Helligkeit im Nachtmodus (0.0–1.0)
  nacht_helligkeit: "0.15"

# Bestätigungstöne (Skripte ton_wake, ton_fehler), erzeugt von tools/ton.mjs
packages:
  ton: !include ton.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      # Gespeicherte Lautstärke anwenden; set_action läuft beim Wiederherstellen nicht von selbst
      - media_player.volume_set:
          id: medien
          volume: !lambda "return id(lautstaerke).state / 100.0f;"
      # Nach dem Start aufs Wakeword lauschen
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password

captive_portal:

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: ${mic_ws}
    i2s_bclk_pin: ${mic_sck}
  - id: i2s_out
    i2s_lrclk_pin: ${amp_lrclk}
    i2s_bclk_pin: ${amp_bclk}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    i2s_din_pin: ${mic_sd}
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: i2s_out
    i2s_dout_pin: ${amp_din}
    dac_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

# Ansagen von Home Assistant (assist_satellite.announce) brauchen einen Media-Player am Sprachassistenten;
# nur intern – die Lautstärke steuert Home Assistant über die Entität «Lautstärke».
media_player:
  - platform: speaker
    id: medien
    name: Medien
    internal: true
    announcement_pipeline:
      speaker: speaker_out
      format: FLAC
      sample_rate: 16000
      num_channels: 1

globals:
  # Lautstärke vor dem Nachtmodus, damit «Nachtmodus aus» sie zurückholt
  - id: lautstaerke_tag
    type: float
    restore_value: true
    initial_value: "60"
  # Ist die Nachtlautstärke gerade gesetzt? ESPHome löst die Schalter-Aktionen auch beim Wiederherstellen nach dem
  # Start und bei erneutem Einschalten aus; nur ein echter Wechsel darf die Lautstärke anfassen.
  - id: nacht_aktiv
    type: bool
    restore_value: true
    initial_value: "false"

number:
  - platform: template
    id: lautstaerke
    name: Lautstärke
    icon: mdi:volume-high
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 60
    set_action:
      # Gleicher Lautsprecher für Ansagen, Antworten und Töne
      - media_player.volume_set:
          id: medien
          volume: !lambda "return x / 100.0f;"
      # ESPHome-Versionen ohne Speaker-Media-Player: stattdessen direkt am Lautsprecher
      #   - speaker.volume_set:
      #       id: speaker_out
      #       volume: !lambda "return x / 100.0f;"

switch:
  - platform: template
    id: nachtmodus
    name: Nachtmodus
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - if:
          condition:
            lambda: "return !id(nacht_aktiv);"
          then:
            - lambda: |-
                const float jetzt = id(lautstaerke).state;
                id(lautstaerke_tag) = std::isnan(jetzt) ? 60.0f : jetzt;
                id(nacht_aktiv) = true;
            - number.set:
                id: lautstaerke
                value: 30
    turn_off_action:
      - if:
          condition:
            lambda: "return id(nacht_aktiv);"
          then:
            - lambda: "id(nacht_aktiv) = false;"
            - number.set:
                id: lautstaerke
                value: !lambda "return std::isnan(id(lautstaerke_tag)) ? 60.0f : id(lautstaerke_tag);"
  - platform: template
    id: ton_feedback
    name: Ton-Feedback
    icon: mdi:bell-ring-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

micro_wake_word:
  microphone:
    microphone: mic
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    # Kurzer Doppelton, erst danach zuhören (sonst landet der Ton in der Spracherkennung)
    - if:
        condition:
          switch.is_on: ton_feedback
        then:
          - script.execute: ton_wake
          - script.wait: ton_wake
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone:
    microphone: mic
  media_player: medien
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - light.turn_on:
        id: led
        brightness: !lambda "return id(nachtmodus).state ? ${nacht_helligkeit}f : 1.0f;"
        red: 100%
        green: 54%
        blue: 24%
        # Der Puls setzt die Helligkeit bei jedem Takt selbst (max_brightness); im Nachtmodus deshalb der gedimmte Puls
        effect: !lambda 'return id(nachtmodus).state ? "pulse_nacht" : "pulse";'
  on_stt_end:
    - light.turn_on:
        id: led
        brightness: !lambda "return id(nachtmodus).state ? ${nacht_helligkeit}f : 1.0f;"
        red: 35%
        green: 65%
        blue: 100%
        effect: none
  on_tts_start:
    - light.turn_on:
        id: led
        brightness: !lambda "return id(nachtmodus).state ? ${nacht_helligkeit}f : 1.0f;"
        red: 100%
        green: 54%
        blue: 24%
        effect: none
  on_end:
    - light.turn_off: led
    - micro_wake_word.start:
  on_error:
    - light.turn_on:
        id: led
        brightness: !lambda "return id(nachtmodus).state ? ${nacht_helligkeit}f : 1.0f;"
        red: 100%
        green: 0%
        blue: 0%
        # Puls aus dem Zuhören beenden, sonst überschreibt er Farbe und Nacht-Helligkeit
        effect: none
    - if:
        condition:
          switch.is_on: ton_feedback
        then:
          - script.execute: ton_fehler
    - delay: 1s
    - light.turn_off: led
    - micro_wake_word.start:

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: Ring
    pin: ${led_pin}
    rgb_order: GRB
    chipset: WS2812
    num_leds: 1
    default_transition_length: 100ms
    effects:
      - pulse:
          name: pulse
          transition_length: 400ms
          update_interval: 400ms
      - pulse:
          name: pulse_nacht
          transition_length: 400ms
          update_interval: 400ms
          min_brightness: 0%
          max_brightness: ${nacht_helligkeit}

binary_sensor:
  - platform: status
    name: Verbunden

button:
  - platform: restart
    name: Neustart
