# JARVIS Satellit – Stimme im Raum (erster Satellit)
# Alles Gemeinsame steht in jarvis-satellit-basis.yaml; hier nur Name und Anzeigename.
# Die Entitätsnamen (Ring, Verbunden, Neustart, Lautstärke, Nachtmodus, Ton-Feedback) bleiben für alle Satelliten gleich;
# Home Assistant unterscheidet sie über den Gerätenamen (z. B. binary_sensor.jarvis_satellit_verbunden).
#
#   esphome config jarvis-satellit.yaml   (prüfen)
#   esphome run jarvis-satellit.yaml      (erstes Mal per USB, danach per WLAN/OTA)

substitutions:
  name: jarvis-satellit
  friendly_name: Jarvis Satellit

packages:
  basis: !include jarvis-satellit-basis.yaml
