# JARVIS Satellit – Stimme im Raum
# ESP32-S3 (DevKitC-1 mit 8 MB PSRAM) + INMP441 I2S-Mikrofon + MAX98357A I2S-Verstärker + Lautsprecher + WS2812-LED
# Wakeword «Hey Jarvis» läuft lokal auf dem Chip (micro_wake_word). Spracherkennung, Antwort und Stimme kommen
# über die Sprach-Pipeline von Home Assistant; dort ist Jarvis als Gesprächs-Agent eingetragen (siehe README).

substitutions:
  name: jarvis-satellit
  friendly_name: Jarvis Satellit
  # I2S-Mikrofon INMP441
  mic_sck: GPIO5
  mic_ws: GPIO4
  mic_sd: GPIO6
  # I2S-Verstärker MAX98357A
  amp_bclk: GPIO15
  amp_lrclk: GPIO16
  amp_din: GPIO7
  led_pin: GPIO48

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
  # Nach dem Start aufs Wakeword lauschen
  on_boot:
    priority: -100
    then:
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password

captive_portal:

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: ${mic_ws}
    i2s_bclk_pin: ${mic_sck}
  - id: i2s_out
    i2s_lrclk_pin: ${amp_lrclk}
    i2s_bclk_pin: ${amp_bclk}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    i2s_din_pin: ${mic_sd}
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: i2s_out
    i2s_dout_pin: ${amp_din}
    dac_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

micro_wake_word:
  microphone:
    microphone: mic
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone:
    microphone: mic
  speaker: speaker_out
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - light.turn_on:
        id: led
        red: 100%
        green: 54%
        blue: 24%
        effect: pulse
  on_stt_end:
    - light.turn_on:
        id: led
        red: 35%
        green: 65%
        blue: 100%
        effect: none
  on_tts_start:
    - light.turn_on:
        id: led
        red: 100%
        green: 54%
        blue: 24%
        effect: none
  on_end:
    - light.turn_off: led
    - micro_wake_word.start:
  on_error:
    - light.turn_on:
        id: led
        red: 100%
        green: 0%
        blue: 0%
    - delay: 1s
    - light.turn_off: led
    - micro_wake_word.start:

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: Ring
    pin: ${led_pin}
    channel_colors: GRB
    chipset: WS2812
    num_leds: 1
    default_transition_length: 100ms
    effects:
      - pulse:
          name: pulse
          transition_length: 400ms
          update_interval: 400ms

binary_sensor:
  - platform: status
    name: Verbunden

button:
  - platform: restart
    name: Neustart

