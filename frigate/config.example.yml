# Frigate-Beispiel für zwei Kameras. Als config.yml in den Frigate-Ordner legen und Adressen/Passwörter ersetzen.
# Zonen zeichnest du am einfachsten in der Frigate-Oberfläche (Kamera → Einstellungen → Zonen) und benennst sie
# so, wie sie in cameras.json stehen (z. B. "eingang").

mqtt:
  enabled: true
  host: 192.168.1.10          # dein Broker (z. B. Mosquitto-Add-on von Home Assistant)
  user: frigate
  password: GEHEIM

detectors:
  # Ein Intel-Mini-PC: OpenVINO auf der iGPU. Alternativ ein Coral-USB-Stick (type: edgetpu, device: usb).
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi   # Intel-Hardwaredecodierung; bei Problemen Zeile entfernen

record:
  enabled: true
  retain:
    days: 3
    mode: motion
  alerts:
    retain:
      days: 14

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  track:
    - person

cameras:
  arbeitsplatz:
    ffmpeg:
      inputs:
        - path: rtsp://BENUTZER:PASSWORT@192.168.30.21:554/h264Preview_01_main
          roles: [record]
        - path: rtsp://BENUTZER:PASSWORT@192.168.30.21:554/h264Preview_01_sub
          roles: [detect]
    detect:
      width: 640
      height: 360
      fps: 5

  raum:
    ffmpeg:
      inputs:
        - path: rtsp://BENUTZER:PASSWORT@192.168.30.22:554/h264Preview_01_main
          roles: [record]
        - path: rtsp://BENUTZER:PASSWORT@192.168.30.22:554/h264Preview_01_sub
          roles: [detect]
    detect:
      width: 640
      height: 360
      fps: 5
    # zones:
    #   eingang:
    #     coordinates: … (in der Oberfläche zeichnen)
